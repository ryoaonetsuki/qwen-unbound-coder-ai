name: CI (no GPU, no model download)
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile backend/gateway.py scripts/download_model.py scripts/test_live.py
      - run: grep -q "Qwen Unbound Coder AI" frontend/index.html && grep -q "ryoaonetsuki" frontend/index.html
